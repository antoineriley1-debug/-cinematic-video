<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Princess Quest">
<meta name="theme-color" content="#ff69b4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Princess Kingdom Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- Title screen -->
<div id="title" class="screen">
  <div class="title-card">
    <div class="title-crown">👑</div>
    <h1>Princess Kingdom<br><span>Quest</span></h1>
    <p class="subtitle">100 magical levels · learn · explore · shine</p>
    <div id="title-tier" class="title-tier"></div>
    <button id="btn-play" class="big-btn pink">▶ Play</button>
    <div class="title-row">
      <button id="btn-levels" class="mid-btn">🗺️ Levels</button>
      <button id="btn-store-title" class="mid-btn">🛍️ Rewards</button>
      <button id="btn-dress-title" class="mid-btn">👗 Dress Up</button>
      <button id="btn-friends-title" class="mid-btn">👭 Friends</button>
      <button id="btn-parent-title" class="mid-btn">🔒 Parents</button>
    </div>
    <p class="hint">Tip: on iPad, tap Share → “Add to Home Screen” to play full screen.</p>
  </div>
</div>

<!-- In-game HUD -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div class="pill" id="hud-level"></div>
    <div class="pill" id="hud-tier"></div>
    <div class="spacer"></div>
    <div class="pill coins" id="hud-coins">🪙 0</div>
    <button class="icon-btn" id="btn-dress" aria-label="Dress up">👗</button>
    <button class="icon-btn" id="btn-friends" aria-label="Friends">👭<span id="online-dot" class="hidden"></span></button>
    <button class="icon-btn hidden" id="btn-chat" aria-label="Chat">💬</button>
    <button class="icon-btn" id="btn-store" aria-label="Reward store">🛍️</button>
    <button class="icon-btn" id="btn-menu" aria-label="Menu">⏸️</button>
  </div>
  <div id="objectives"></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="friends-bar" class="hidden"></div>
  <div id="toasts"></div>
  <div id="chat-log" class="hidden"></div>
  <div id="chat-pick" class="hidden"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="dock">
    <button class="icon-btn" id="btn-voice" aria-label="Voice chat" hidden>🎙️</button>
    <button class="icon-btn" id="btn-today" aria-label="Today">📅</button>
    <button class="icon-btn" id="btn-family" aria-label="Family team">🏆</button>
    <button class="icon-btn" id="btn-pets" aria-label="Pets">🐾</button>
    <button class="icon-btn" id="btn-ride" aria-label="Ride">🛴</button>
  </div>
  <div id="alert-bar" hidden></div>
  <div id="tag-hud" hidden></div>
  <button id="btn-tag" hidden>❄️<small>TAG!</small></button>
  <button id="btn-ptt" hidden>🎙️<small>HOLD TO TALK</small></button>
  <button id="btn-jump" aria-label="Jump">⬆️<small>JUMP</small></button>
  <button id="btn-action" class="hidden"></button>
</div>

<!-- Generic modal -->
<div id="modal" class="hidden"><div id="modal-box"></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/learner.js"></script>
<script src="js/present.js"></script>
<script src="js/minigames.js"></script>
<script src="js/shops.js"></script>
<script src="js/net.js"></script>
<script src="js/family.js"></script>
<script src="js/rewards.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/events.js"></script>
<script src="js/coop.js"></script>
<script src="js/arena.js"></script>
<script src="js/voice.js"></script>
</body>
</html>
